name: grill-with-html skill

on:
  pull_request:
    paths:
      - ".github/workflows/grill-with-html.yml"
      - "skills/general/grill-with-html/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/grill-with-html.yml"
      - "skills/general/grill-with-html/**"

permissions:
  contents: read

jobs:
  test:
    name: Builder and page checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run checks
        run: python3 skills/general/grill-with-html/test_grill.py
