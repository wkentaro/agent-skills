name: Visual recap skill

on:
  pull_request:
    paths:
      - ".github/workflows/visual-recap.yml"
      - "skills/general/visual-recap/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/visual-recap.yml"
      - "skills/general/visual-recap/**"

permissions:
  contents: read

jobs:
  test:
    name: Render checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run checks
        run: python3 skills/general/visual-recap/test_render.py
