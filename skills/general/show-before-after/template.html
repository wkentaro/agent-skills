<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before / After</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fbfbfa, #151515);
    --surface: light-dark(#ffffff, #1d1d1d);
    --text: light-dark(#1b1b1a, #ececea);
    --muted: light-dark(#6b6b68, #9a9a96);
    --line: light-dark(rgb(0 0 0 / 0.08), rgb(255 255 255 / 0.1));
    --accent: light-dark(#c2410c, #fb923c);
    --pin-text: light-dark(#ffffff, #1b1b1a);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1600px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { margin: 0; font-size: 24px; font-weight: 500; }
  #summary { margin: 8px 0 0; max-width: 72ch; color: var(--muted); }
  #controls { display: flex; flex-wrap: wrap; gap: 16px; margin: 24px 0; }
  .group { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .group button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 6px 12px; cursor: pointer; }
  .group button + button { border-left: 1px solid var(--line); }
  .group button[aria-pressed="true"] { background: var(--surface); color: var(--text); }
  #panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
  body.stacked #panes { grid-template-columns: minmax(0, 1fr); }
  h2 { margin: 0; font-size: 16px; font-weight: 500; }
  .source { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .frame { --pad: 12px; --lh: 19.5px; position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
  .frame img { display: block; width: 100%; height: auto; }
  .frame pre { margin: 0; padding: var(--pad) 16px var(--pad) 40px; font: 13px/var(--lh) ui-monospace, monospace; white-space: pre; overflow-x: auto; }
  .frame iframe { position: absolute; inset: 0 auto auto 0; border: 0; transform-origin: 0 0; background: #fff; }
  .pin { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--accent); color: var(--pin-text); font-size: 12px; font-weight: 500; display: grid; place-items: center; z-index: 2; }
  .region { position: absolute; border: 2px solid var(--accent); border-radius: 4px; opacity: 0; transition: opacity 120ms ease-out; z-index: 1; pointer-events: none; }
  .pin.text { left: 16px; margin-top: 0; top: calc(var(--pad) + (var(--row) - 1) * var(--lh)); }
  .hot.pin { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .hot.region { opacity: 1; }
  body.bare .pin, body.bare .region, body.bare ol { display: none; }
  ol { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
  li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 4px; border-radius: 6px; }
  li .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); font-size: 12px; display: grid; place-items: center; }
  li.hot { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  li strong { font-weight: 500; }
  li p { margin: 0; color: var(--muted); }
  @media (max-width: 900px) { #panes { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="summary"></p>
  <div id="controls"></div>
  <div id="panes"></div>
</main>
<script>
const SPEC = /*__SPEC__*/null;
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "text" ? (el.textContent = v) : el.setAttribute(k, v);
  el.append(...kids);
  return el;
};
let variant = 0;

function place(el, pin, w, h, inset = 0) {
  el.style.left = `clamp(${inset}px, ${(pin.x / w) * 100}%, calc(100% - ${inset}px))`;
  el.style.top = `clamp(${inset}px, ${(pin.y / h) * 100}%, calc(100% - ${inset}px))`;
}

function frameFor(pane, notes) {
  const frame = $("div", { class: "frame" });
  const pins = notes.map((note, i) => $("span", { class: "pin", "data-n": i + 1, text: i + 1 }));
  const regions = pane.type === "text" ? [] : notes.map((note, i) => $("span", { class: "region", "data-n": i + 1 }));
  const layout = (w, h) => notes.forEach((note, i) => {
    place(pins[i], note.pin, w, h, 11);
    if (note.pin.width) {
      place(regions[i], note.pin, w, h);
      regions[i].style.width = `${(note.pin.width / w) * 100}%`;
      regions[i].style.height = `${(note.pin.height / h) * 100}%`;
    }
  });
  if (pane.type === "image") {
    const img = $("img", { src: pane.src, alt: pane.source });
    img.addEventListener("load", () => layout(img.naturalWidth / (pane.scale || 1), img.naturalHeight / (pane.scale || 1)));
    frame.append(img);
  } else if (pane.type === "text") {
    frame.append($("pre", { text: pane.content }));
    notes.forEach((note, i) => {
      pins[i].classList.add("text");
      pins[i].style.setProperty("--row", note.pin.line);
    });
  } else {
    const w = pane.width || 1280, h = pane.height || 800;
    const iframe = $("iframe", { width: w, height: h, title: pane.source });
    if (pane.type === "html") Object.assign(iframe, { sandbox: "allow-scripts", srcdoc: pane.content }); else iframe.src = pane.src;
    frame.style.aspectRatio = `${w} / ${h}`;
    new ResizeObserver(() => { iframe.style.transform = `scale(${frame.clientWidth / w})`; }).observe(frame);
    frame.append(iframe);
    layout(w, h);
  }
  frame.append(...regions, ...pins);
  return frame;
}

function paneFor(side, pane) {
  const notes = pane.notes;
  const title = side === "before" ? "Before" : `After · ${pane.summary}`;
  const list = $("ol", {}, ...notes.map((note, i) =>
    $("li", { "data-n": i + 1 }, $("span", { class: "n", text: i + 1 }),
      $("div", {}, $("strong", { text: note.claim }), $("p", { text: note.why })))));
  const section = $("section", {}, $("h2", { text: title }), $("p", { class: "source", text: pane.source }), frameFor(pane, notes), list);
  section.addEventListener("mouseover", (e) => {
    const n = e.target.closest("[data-n]")?.dataset.n;
    section.querySelectorAll(".hot").forEach((el) => el.classList.remove("hot"));
    if (n) section.querySelectorAll(`[data-n="${n}"]`).forEach((el) => el.classList.add("hot"));
  });
  return section;
}

function group(options, current, onPick) {
  const el = $("div", { class: "group", role: "group" });
  options.forEach((label, i) => {
    const button = $("button", { type: "button", "aria-pressed": i === current, text: label });
    button.addEventListener("click", () => {
      el.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-pressed", j === i));
      onPick(i);
    });
    el.append(button);
  });
  return el;
}

function render() {
  const v = SPEC.variants[variant];
  document.querySelector("#panes").replaceChildren(paneFor("before", v.before), paneFor("after", v.after));
}

document.title = SPEC.title;
document.querySelector("#title").textContent = SPEC.title;
document.querySelector("#summary").textContent = SPEC.summary;
const controls = document.querySelector("#controls");
controls.append(
  group(["Notes on", "Notes off"], 0, (i) => document.body.classList.toggle("bare", i === 1)),
  group(["Side by side", "Stacked"], 0, (i) => document.body.classList.toggle("stacked", i === 1)),
);
if (SPEC.variants.length > 1) controls.append(group(SPEC.variants.map((v) => v.name), 0, (i) => { variant = i; render(); }));
render();
</script>
</body>
</html>
