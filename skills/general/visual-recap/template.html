<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{
  --paper:#f7f5f0; --ink:#1d1c19; --muted:#66635b; --line:rgba(29,28,25,.1);
  --sand:#e8ddc8; --sage:#d3dece; --mist:#d9dfe8; --clay:#ecd6cb; --stone:#e2e0d9; --sheet:#fbf9f4;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.page{max-width:1200px;margin-inline:auto;padding-inline:40px;padding-block:72px 96px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:24px;border-bottom:1px solid var(--line)}
h1{font:400 40px/1.1 var(--serif);letter-spacing:-.01em}
header span{color:var(--muted);font-size:15px}
.grid{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:32px;margin-top:40px}
.art{aspect-ratio:1;border-radius:12px;display:grid;place-items:center}
.art svg{width:86%;height:86%;overflow:visible}
.card .k{font-size:13px;color:var(--muted);margin-top:20px}
.card h2{font:400 22px/1.25 var(--serif);margin-top:4px}
.card ul{list-style:none;padding:0;margin-top:10px;font-size:15px;color:var(--muted)}
.card li{position:relative;padding-left:16px;line-height:1.45;margin-top:6px}
.card li::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.card li b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

@media (max-width:760px){
  .page{padding-inline:20px;padding-block:40px 64px}
  h1{font-size:30px}
  header{flex-direction:column;gap:4px}
  .grid{grid-auto-flow:row;gap:0;margin-top:8px}
  .card{display:grid;grid-template-columns:96px 1fr;column-gap:16px;padding-block:20px;border-bottom:1px solid var(--line)}
  .art{grid-row:span 3;border-radius:10px;align-self:start}
  .art svg{width:94%;height:94%}
  .art .lbl,.art .sm{display:none}
  .card .k{margin-top:0}
  .card h2{font-size:19px}
  .card ul{font-size:14.5px;margin-top:6px}
  .card li{margin-top:4px}
}

/* drawing vocabulary, see DRAWING.md */
.i{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.t{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.f{fill:none;stroke:rgba(29,28,25,.28);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sheet{fill:var(--sheet)}
.fill{fill:var(--ink)}
.shade{fill:rgba(29,28,25,.12)}
.lbl{font:500 11px var(--sans);fill:var(--ink)}
.sm{font:400 9px var(--sans);fill:var(--muted)}
.draw{stroke-dasharray:1;stroke-dashoffset:1}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4)}
.drop{opacity:0;transform:translateY(-8px)}
.play .draw{animation:draw var(--d,1s) cubic-bezier(.3,.6,.3,1) var(--w,0s) forwards}
.play .pop{animation:pop .35s cubic-bezier(.2,.8,.3,1) var(--w,0s) forwards}
.play .drop{animation:drop .45s ease-out var(--w,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes drop{to{opacity:1;transform:none}}
.still *{animation:none!important}
.still .draw{stroke-dashoffset:0}
.still .pop,.still .drop{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .art *{animation:none!important}
  .draw{stroke-dashoffset:0}
  .pop,.drop{opacity:1;transform:none}
}
{{CARD_CSS}}
</style>
</head>
<body>
<div class="page">
<header>
  <h1>{{TITLE}}</h1>
  <span>{{SUBTITLE}}</span>
</header>
<div class="grid">
{{CARDS}}
</div>
</div>
<script>
// ?still shows every drawing in its final frame, for screenshots.
if(location.search.includes('still')){
  document.documentElement.classList.add('still');
}else{
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('play');io.unobserve(e.target)}}),{threshold:.4});
  document.querySelectorAll('.art').forEach(a=>io.observe(a));
}
</script>
</body>
</html>
