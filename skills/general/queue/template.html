<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Decision queue</title>
<style>
*, *::before, *::after { box-sizing: border-box; min-width: 0; }
:root {
  color-scheme: light dark;
  --page: light-dark(oklch(0.985 0 none), oklch(0.19 0 none));
  --card: light-dark(oklch(1 0 none), oklch(0.215 0 none));
  --raised: light-dark(oklch(0.96 0 none), oklch(0.26 0 none));
  --text: light-dark(oklch(0.2 0 none), oklch(0.94 0 none));
  --text-2: light-dark(oklch(0.42 0 none), oklch(0.72 0 none));
  --text-3: light-dark(oklch(0.52 0 none), oklch(0.62 0 none));
  --line: color-mix(in oklch, var(--text) 10%, transparent);
  --accent: light-dark(oklch(0.5 0.13 250), oklch(0.74 0.11 250));
  --accent-soft: color-mix(in oklch, var(--accent) 12%, transparent);
  --ok: light-dark(oklch(0.5 0.12 150), oklch(0.75 0.13 150));
  --warn: light-dark(oklch(0.52 0.12 60), oklch(0.78 0.12 70));
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 6px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
html { overscroll-behavior-y: none; }
body {
  margin: 0; height: 100dvh; display: flex; flex-direction: column;
  background: var(--page); color: var(--text);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: var(--accent); text-underline-offset: 0.15em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
kbd {
  font: 11px/1 var(--mono); padding: 3px 5px; border-radius: 4px;
  border: 1px solid var(--line); background: var(--raised); color: var(--text-2);
}
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--text-3); }

.top {
  flex: none; display: flex; align-items: center; gap: 16px;
  padding: 12px 20px; border-block-end: 1px solid var(--line);
}
.top h1 { font-size: 15px; font-weight: 500; }
.top .count { color: var(--text-2); font-variant-numeric: tabular-nums; }
.top .spacer { flex: 1; }
.top > * { white-space: nowrap; }
@media (width < 48rem), (pointer: coarse) { #keys { display: none; } }
@media (width < 48rem) { .top { flex-wrap: wrap; gap: 8px; padding-inline: 16px; } .top h1 { display: none; } }
.btn {
  min-block-size: 32px; padding: 0 12px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--card);
}
.btn.primary { background: var(--text); color: var(--page); border-color: transparent; }
.btn:active { transform: scale(0.98); }
@media (hover: hover) and (pointer: fine) {
  .btn:hover { background: var(--raised); }
  .btn.primary:hover { background: color-mix(in oklch, var(--text) 85%, var(--page)); }
  .row:hover, .lrow:hover { background: var(--raised); }
  .opt:hover { border-color: color-mix(in oklch, var(--text) 30%, transparent); }
}
main { flex: 1; min-block-size: 0; container-type: inline-size; display: flex; }

/* shared detail pieces */
.detail { display: flex; flex-direction: column; gap: 20px; }
.detail h2 { font-size: 18px; font-weight: 500; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--text-3); font-size: 12px; }
.sec h3 { font-size: 12px; font-weight: 500; color: var(--text-3); margin-block-end: 6px; }
.sec p + p { margin-block-start: 8px; }
.ev { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ev li { display: grid; grid-template-columns: 6.5rem 1fr; gap: 12px; align-items: baseline; }
.lvl { font: 11px/1.4 var(--mono); color: var(--text-3); }
.lvl.ran, .lvl.seen { color: var(--ok); }
.lvl.reported, .lvl.claimed { color: var(--warn); }
.danger { display: flex; flex-wrap: wrap; gap: 4px 24px; color: var(--text-2); }
.danger b { font-weight: 500; color: var(--text); }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; text-align: start;
  padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card);
}
.opt .what { font-weight: 500; }
.opt .why { grid-column: 2; color: var(--text-2); font-size: 13px; }
.opt .rec { font-weight: 400; color: var(--accent); font-size: 12px; margin-inline-start: 6px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
textarea {
  inline-size: 100%; field-sizing: content; min-block-size: 3lh; max-block-size: 16lh; resize: none;
  padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--card);
}
textarea.draft { font: 12px/1.6 var(--mono); }
.targets { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; }

/* A: inbox */
.inbox { flex: 1; display: grid; grid-template-columns: minmax(18rem, 24rem) 1fr; min-block-size: 0; }
.list { overflow-y: auto; overscroll-behavior: contain; border-inline-end: 1px solid var(--line); }
.group { display: flex; align-items: baseline; gap: 8px; padding: 16px 20px 6px; font-size: 12px; color: var(--text-3); }
.group span { flex: 1; }
.link { all: unset; cursor: pointer; color: var(--accent); font-size: 12px; }
.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row .tag { font: 11px var(--mono); color: var(--text-3); }
.row .tag.ok { color: var(--ok); }
.row .tag.weak { color: var(--warn); }
.row {
  display: grid; grid-template-columns: 8px 1fr auto; gap: 2px 10px; align-items: baseline;
  inline-size: 100%; text-align: start; padding: 10px 20px; border: 0; background: none;
  border-block-end: 1px solid var(--line);
}
.row[aria-current="true"] { background: var(--raised); }
.dot { inline-size: 8px; block-size: 8px; border-radius: 50%; background: var(--accent); align-self: center; }
.row.done .dot { background: none; border: 1px solid var(--text-3); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.done .t { font-weight: 400; color: var(--text-2); }
.row .s { grid-column: 2 / -1; color: var(--text-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .ans { font: 11px var(--mono); color: var(--text-2); }
.pane { overflow-y: auto; overscroll-behavior: contain; padding: 24px 32px 48px; }
.pane .detail { max-inline-size: 46rem; }
.back { display: none; margin-block-end: 12px; }
@container (width < 48rem) {
  .inbox { grid-template-columns: 1fr; }
  .inbox.reading .list, .inbox:not(.reading) .pane { display: none; }
  .back { display: inline-flex; align-items: center; }
  .pane { padding: 16px 16px 48px; }
}
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--text); padding: 20px; inline-size: min(44rem, 92vw); }
dialog::backdrop { background: oklch(0 0 none / 0.4); }
dialog h2 { font-size: 15px; font-weight: 500; margin-block-end: 4px; }
dialog .actions { display: flex; gap: 8px; justify-content: flex-end; margin-block-start: 12px; }
.tagline { font: 11px var(--mono); color: var(--warn); }
.reply { border-inline-start: 2px solid var(--accent); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 6px; }
.reply .q { color: var(--text-2); }
.visuals { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 12px; }
figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
figure .frame { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: clip; }
figure pre { margin: 0; padding: 12px; font: 12px/1.55 var(--mono); overflow-x: auto; }
figure pre .add { color: var(--ok); }
figure pre .del { color: light-dark(oklch(0.5 0.17 25), oklch(0.72 0.15 25)); }
figure img { display: block; max-inline-size: 100%; block-size: auto; margin-inline: auto; }
figure iframe { display: block; inline-size: 100%; border: 0; background: white; }
figcaption { font-size: 12px; color: var(--text-2); display: flex; gap: 8px; align-items: center; }
figure:not(.pick) { grid-column: 1 / -1; }
figure.pick { cursor: pointer; }
figure.pick iframe { pointer-events: none; }
figure.pick.on .frame { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.settled { color: var(--text-2); }
code { font: 12px var(--mono); background: var(--raised); padding: 1px 4px; border-radius: 4px; }

</style>
</head>
<body>
<header class="top">
  <h1 id="title"></h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <span class="muted" id="keys"><kbd>j</kbd> <kbd>k</kbd> move &nbsp; <kbd>1</kbd>-<kbd>9</kbd> choose &nbsp; <kbd>a</kbd> accept &nbsp; <kbd>n</kbd> note</span>
  <button class="btn" id="verified"></button>
  <button class="btn primary" id="showOut"></button>
</header>
<main id="main"></main>
<dialog id="out">
  <h2>Answers</h2>
  <p class="muted">Copy this and paste it back to the agent. Unanswered items stay in the queue for the next round.</p>
  <textarea class="draft" id="outText" readonly></textarea>
  <div class="actions"><button class="btn" id="copy">Copy</button><button class="btn primary" id="closeOut">Close</button></div>
</dialog>

<script>
const QUEUE = /*__QUEUE__*/null;
const ITEMS = [...QUEUE.items.filter(x => !x.settled), ...QUEUE.items.filter(x => x.settled)];
const LEVELS = { ran: "ran it", seen: "saw it", read: "read it", reported: "reported", claimed: "claimed" };
const KEY = `queue:${QUEUE.queue}:${QUEUE.round}`;
const state = { sel: Math.max(0, ITEMS.findIndex(x => !x.settled)), reading: false, answers: Object.create(null) };
// Null prototype: an item id such as "constructor" must not hit an inherited property.
try { Object.assign(state.answers, JSON.parse(localStorage.getItem(KEY))); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state.answers)); } catch {} };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Inline markdown only: `code`, **bold**, [label](https://url).
const md = s => esc(s)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
const ans = it => state.answers[it.id] || {};
const decided = it => Boolean(ans(it).choice);
const noted = it => !decided(it) && Boolean((ans(it).note || "").trim());
const groupOf = it => it.settled ? "Settled in earlier rounds" : [it.from, it.group].filter(Boolean).join(" · ");
const opts = it => it.options || [];
const rec = it => (opts(it).find(o => o.recommended) || {}).key;
// Bulk accept skips notes: a note without a choice is a question for the agent.
const pending = it => !it.settled && !decided(it) && !noted(it) && rec(it);
// Verified: the agent ran it or saw it, the action can be undone, there is a recommendation,
// and the item is not marked as needing the user's own look.
const verified = it => !it.settled && !it.confirm && rec(it) && it.door === "two-way" && it.evidence.some(e => e.level === "ran" || e.level === "seen");
const tag = it => verified(it) ? ["ok", "verified"]
  : !rec(it) ? ["", "your call"]
  : it.evidence.every(e => e.level === "reported" || e.level === "claimed") ? ["weak", "not re-checked"] : ["", "your call"];

function visual(it, v) {
  const o = !it.settled && v.option && opts(it).find(o => o.key === v.option);
  const n = o ? opts(it).indexOf(o) + 1 : 0;
  let inner;
  if (v.type === "image") inner = `<img src="${esc(v.src)}" alt="${esc(v.title || "")}">`;
  else if (v.type === "html") inner = `<iframe sandbox srcdoc="${esc(v.content)}" style="block-size:${+v.height || 320}px" title="${esc(v.title || "")}"></iframe>`;
  else if (v.type === "diff") inner = `<pre>${v.content.split("\n").map(l =>
    l.startsWith("+") ? `<span class="add">${esc(l)}</span>` : l.startsWith("-") ? `<span class="del">${esc(l)}</span>` : esc(l)).join("\n")}</pre>`;
  else inner = `<pre>${esc(v.content)}</pre>`;
  const cap = [o ? `<kbd>${n}</kbd>` : "", esc(v.title || (o ? o.label : ""))].join(" ");
  return `<figure class="${o ? "pick" : ""} ${o && ans(it).choice === o.key ? "on" : ""}" ${o ? `data-choose="${esc(o.key)}"` : ""}>
    <div class="frame">${inner}</div>${cap.trim() ? `<figcaption>${cap}</figcaption>` : ""}</figure>`;
}

function body(it) {
  const a = ans(it);
  const settled = it.settled && `<section class="sec"><h3>Settled</h3><p class="settled"><b>${esc(it.settled.choice)}</b>${it.settled.note ? " · " + md(it.settled.note) : ""}</p></section>`;
  return `
  ${it.reply ? `<section class="sec"><h3>Reply to your note</h3><div class="reply"><p class="q">${md(it.reply.asked)}</p><p>${md(it.reply.answer)}</p></div></section>` : ""}
  ${it.changed ? `<section class="sec"><h3>Changed since last round</h3><p>${md(it.changed)}</p></section>` : ""}
  ${it.links ? `<div class="targets">${it.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(" ")}</div>` : ""}
  <section class="sec"><h3>Summary</h3>${it.summary.map(p => `<p>${md(p)}</p>`).join("")}</section>
  ${it.visuals ? `<section class="sec"><div class="visuals">${it.visuals.map(v => visual(it, v)).join("")}</div></section>` : ""}
  <section class="sec"><h3>Evidence</h3><ul class="ev">${it.evidence.map(e =>
    `<li><span class="lvl ${e.level}">${LEVELS[e.level]}</span><span>${md(e.text)}</span></li>`).join("")}</ul></section>
  <section class="sec"><h3>Danger</h3><div class="danger"><span><b>Door</b> ${esc(it.door)}</span><span><b>Blast radius</b> ${esc(it.blast)}</span></div></section>
  ${settled || `<section class="sec"><h3>Decide</h3><div class="opts">${it.options.map((o, i) =>
    `<button class="opt" data-choose="${esc(o.key)}" aria-pressed="${a.choice === o.key}">
       <kbd>${i + 1}</kbd><span class="what">${esc(o.label)}${o.recommended ? '<span class="rec">recommended</span>' : ""}</span>
       ${o.consequence ? `<span class="why">${md(o.consequence)}</span>` : ""}</button>`).join("")}</div></section>
  ${it.draft ? `<section class="sec"><h3>${esc(it.draft.label || "Draft")}</h3><textarea class="draft" data-field="draft" spellcheck="false">${esc(a.draft ?? it.draft.text)}</textarea></section>` : ""}
  <section class="sec"><h3>Note or question to the agent</h3><textarea data-field="note" id="note" placeholder="Send a note without choosing to get a reply next round">${esc(a.note || "")}</textarea></section>`}`;
}

function chrome() {
  const open = ITEMS.filter(x => !x.settled);
  const d = open.filter(decided).length, n = open.filter(noted).length;
  $("#title").textContent = `${QUEUE.title} · round ${QUEUE.round}`;
  $("#count").textContent = `${d} decided${n ? `, ${n} with a note` : ""}, ${open.length - d - n} open`;
  const v = ITEMS.filter(x => verified(x) && pending(x)).length;
  $("#verified").textContent = `Accept ${v} verified`; $("#verified").hidden = v === 0;
  $("#showOut").textContent = d + n ? `Send ${d + n} of ${open.length}` : "Send answers";
}
function render() {
  const scroll = $(".pane")?.scrollTop, listScroll = $(".list")?.scrollTop;
  const it = ITEMS[state.sel];
  let last = null;
  const rows = ITEMS.map((x, i) => {
    const g = groupOf(x);
    const open = ITEMS.filter(y => groupOf(y) === g && pending(y)).length;
    const h = g !== last ? `<div class="group"><span>${esc(g)}</span>${open ? `<button class="link" data-accept="${esc(g)}">Accept ${open > 1 ? "all " + open : "recommended"}</button>` : ""}</div>` : "";
    last = g;
    const [cls, text] = tag(x);
    const right = x.settled ? `<span class="ans">${esc(x.settled.choice)}</span>`
      : decided(x) ? `<span class="ans">${esc(ans(x).choice)}</span>`
      : noted(x) ? `<span class="tag">note</span>`
      : `<span class="tag ${cls}">${x.reply || x.changed ? "updated · " : ""}${text}</span>`;
    return `${h}<button class="row ${x.settled || decided(x) || noted(x) ? "done" : ""}" data-sel="${i}" aria-current="${i === state.sel}">
      <span class="dot"></span><span class="t">${esc(x.title)}</span>${right}
      <span class="s">${esc(x.summary[0].replace(/[`*]|\]\([^)]*\)|\[/g, ""))}</span></button>`;
  }).join("");
  $("#main").innerHTML = `<div class="inbox ${state.reading ? "reading" : ""}">
    <div class="list">${rows}</div>
    <div class="pane"><button class="btn back" data-back>Back to list</button>
      <article class="detail" data-item="${esc(it.id)}"><h2>${esc(it.title)}</h2>
        <div class="meta">${it.from ? `<span>${esc(it.from)}</span>` : ""}${it.waiting ? "<span>an agent is waiting on this</span>" : ""}</div>${body(it)}</article></div></div>`;
  chrome();
  if (scroll) $(".pane").scrollTop = scroll;
  if (listScroll) $(".list").scrollTop = listScroll;
}
function choose(id, key) { const a = state.answers[id] ||= {}; a.choice = a.choice === key ? undefined : key; save(); render(); }
function move(d) { state.reading = true; state.sel = Math.max(0, Math.min(ITEMS.length - 1, state.sel + d)); render(); $(".pane").scrollTop = 0; $('[aria-current="true"]').scrollIntoView({ block: "nearest" }); }
function accept(items) { items.filter(pending).forEach(x => { (state.answers[x.id] ||= {}).choice = rec(x); }); save(); render(); }
function output() {
  const lines = ITEMS.filter(x => !x.settled && (decided(x) || noted(x))).map(it => {
    const a = ans(it), out = [`${it.id}: ${a.choice || "?"}`];
    if ((a.note || "").trim()) out.push(`  note: ${a.note.trim().replace(/\n/g, "\n    ")}`);
    if (it.draft && a.draft !== undefined && a.draft !== it.draft.text) out.push("  draft: |\n" + a.draft.split("\n").map(l => "    " + l).join("\n"));
    return out.join("\n");
  });
  return lines.length ? `queue: ${QUEUE.queue}  round: ${QUEUE.round}\n` + lines.join("\n") : "Nothing answered yet.";
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-choose],[data-sel],[data-back],[data-accept]");
  if (!t) return;
  if (t.dataset.choose) choose(t.closest("[data-item]").dataset.item, t.dataset.choose);
  else if (t.dataset.sel) { state.sel = +t.dataset.sel; state.reading = true; render(); $(".pane").scrollTop = 0; }
  else if ("back" in t.dataset) { state.reading = false; render(); }
  else if (t.dataset.accept !== undefined) accept(ITEMS.filter(x => groupOf(x) === t.dataset.accept));
});
document.addEventListener("input", e => {
  const f = e.target.dataset.field;
  if (!f) return;
  (state.answers[e.target.closest("[data-item]").dataset.item] ||= {})[f] = e.target.value; save(); chrome();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && e.target.matches("textarea")) { e.target.blur(); render(); return; }
  if (e.target.matches("textarea, input") || e.metaKey || e.ctrlKey || e.altKey || $("#out").open) return;
  const it = ITEMS[state.sel];
  if (e.key === "j") move(1);
  else if (e.key === "k") move(-1);
  else if (it.settled) return;
  else if (e.key === "a" && rec(it)) { if (!decided(it)) choose(it.id, rec(it)); move(1); }
  else if (e.key === "n") { e.preventDefault(); state.reading = true; render(); $("#note").focus(); }
  else if (/^[1-9]$/.test(e.key) && it.options[e.key - 1]) { state.reading = true; choose(it.id, it.options[e.key - 1].key); }
});
$("#verified").onclick = () => accept(ITEMS.filter(verified));
$("#showOut").onclick = () => { $("#outText").value = output(); $("#out").showModal(); };
$("#closeOut").onclick = () => $("#out").close();
$("#copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("#outText").value); $("#copy").textContent = "Copied"; }
  catch { $("#outText").select(); $("#copy").textContent = "Select all, then copy"; }
};
render();
</script>
</body>
</html>
